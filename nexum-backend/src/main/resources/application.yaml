spring:
  application:
    name: nexum

  # Agent workers are I/O-bound on LLM calls; virtual threads remove
  # thread-pool tuning from the critical path.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${NEXUM_DB_URL:jdbc:postgresql://localhost:26257/nexum?sslmode=disable}
    username: ${NEXUM_DB_USERNAME:root}
    password: ${NEXUM_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      pool-name: nexum-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.CockroachDialect
        jdbc:
          time_zone: UTC
          lob:
            # The pg driver does not implement createClob(); without this,
            # Hibernate probes for it on startup, the call throws, and Hikari
            # discards the connection with a scary WARN. Purely cosmetic, but
            # a clean startup log matters when a judge is watching.
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # CockroachDB does not support the advisory-lock strategy Flyway uses
    # for PostgreSQL. Without this, migrations can hang or fail outright.
    postgresql:
      transactional-lock: false

  ai:
    # Explicit provider selection. Three model starters are on the classpath
    # (openai/groq, ollama, bedrock) so Spring AI must be told which to wire.
    model:
      chat: openai
      # Bedrock is the DEFAULT, not a profile opt-in. Local dev and the deployed
      # app then use the same embedding provider, so vectors are identical
      # everywhere - the same reasoning as using real CockroachDB over Postgres.
      # Ollama is an offline fallback behind the 'ollama' profile.
      embedding: bedrock-titan

    # Groq exposes an OpenAI-compatible API, so the OpenAI starter is pointed
    # at it via base-url. Groq does NOT serve embeddings - hence the separate
    # embedding provider above.
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          # Groq retires models with little notice. llama-3.3-70b-versatile was
          # answering requests on 16 Aug and returned model_not_found hours
          # later, which surfaced as a 404 that looked like a bad base-url.
          # If this 404s, list what is actually live before touching anything
          # else:
          #   curl https://api.groq.com/openai/v1/models \
          #     -H "Authorization: Bearer $GROQ_API_KEY"
          model: ${NEXUM_GROQ_MODEL:openai/gpt-oss-120b}
          temperature: 0.2

    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
        # Credentials are deliberately NOT set here. Omitting them lets the AWS
        # SDK default credential chain run, which picks up (in order) env vars,
        # the shared profile, and - crucially - the EC2 instance role in
        # production. Setting them to empty strings would override the chain and
        # break instance-role auth on the deployed box.
      titan:
        embedding:
          model: amazon.titan-embed-text-v2:0

nexum:
  research:
    # Live web research. Absent, agents fall back to the offline corpus and say
    # so at startup - a missing key is a supported configuration, not a failure.
    tavily-api-key: ${TAVILY_API_KEY:}
    # Can safely exceed nexum.agent.lease-seconds: the heartbeat renews the lease
    # from its own scheduler thread, so a slow search blocks the worker without
    # making a live agent look dead. That independence is the reason a network
    # call is allowed on this path at all. It still needs a bound - an HTTP call
    # with no timeout would hang a run holding a lease forever, which no amount
    # of heartbeating makes acceptable.
    timeout-seconds: 20

  embedding:
    # Fixed at 1024 so local (mxbai-embed-large) and deployed
    # (Titan Text Embeddings v2 @ 1024) share one schema.
    # Changing this means re-embedding everything and rebuilding the index.
    dimensions: 1024

management:
  endpoints:
    web:
      exposure:
        # Health only. The other endpoints expose configuration, environment,
        # and bean wiring, none of which belongs on a public demo URL.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.nexum: DEBUG

---
# Offline fallback ONLY. Use when you have no AWS access and need to keep
# working: --spring.profiles.active=local,ollama
#
# Requires the official ollama/ollama image (~4GB) - alpine/ollama does NOT
# work, it ships without the llama-server inference binary.
#   curl -s http://localhost:11434/api/pull -d '{"name":"mxbai-embed-large"}'
#
# mxbai-embed-large is 1024-dim, matching Titan v2, so the schema is unchanged.
# Vectors will NOT match Bedrock-generated ones - do not mix them in one database.
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      embedding: ollama
    ollama:
      base-url: ${NEXUM_OLLAMA_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      embedding:
        options:
          model: mxbai-embed-large
          # Keeping the model resident is configured on the Ollama container as
          # OLLAMA_KEEP_ALIVE, not here. Setting it through the client was tried
          # and silently did nothing - `ollama ps` still showed the default
          # five-minute expiry - and a setting that looks effective but is not is
          # worse than no setting at all.
